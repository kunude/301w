name: Build ImmortalWrt for QNAP 301W

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      release:
        description: 'Upload to release'
        required: false
        default: 'false'
  schedule:
    - cron: 0 20 * * 0

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: ${{ github.event.inputs.release }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id || !github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
          gettext gcc-multilib g++-multilib git gperf haveged help2man intltool \
          libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev \
          libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pip python3-pyelftools qemu-utils re2c rsync scons \
          squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
          xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone ImmortalWrt source
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Run DIY script (before feeds)
      run: |
        cd openwrt
        if [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ]; then
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"
        fi

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Run DIY script (after feeds)
      run: |
        cd openwrt
        if [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ]; then
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
        fi

    - name: Generate config for 301W
      run: |
        cd openwrt
        cat > .config << 'EOF'
        # ============================================
        # Target: QNAP 301W (IPQ8072A / qualcommax/ipq807x)
        # ============================================
        CONFIG_TARGET_qualcommax=y
        CONFIG_TARGET_qualcommax_ipq807x=y
        CONFIG_TARGET_qualcommax_ipq807x_DEVICE_qnap_301w=y

        # Image options
        CONFIG_TARGET_KERNEL_PARTSIZE=64
        CONFIG_TARGET_ROOTFS_PARTSIZE=512
        CONFIG_TARGET_ROOTFS_SQUASHFS=y

        # ============================================
        # Basic System
        # ============================================
        CONFIG_PACKAGE_dnsmasq-full=y
        # CONFIG_PACKAGE_dnsmasq is not set

        # ============================================
        # LuCI Web Interface
        # ============================================
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        # CONFIG_PACKAGE_luci-theme-argon=y  # 可选主题

        # ============================================
        # Wireless (ath11k Wi-Fi 6)
        # ============================================
        CONFIG_PACKAGE_kmod-ath11k=y
        CONFIG_PACKAGE_ath11k-firmware-ipq8074=y
        CONFIG_PACKAGE_wpad-openssl=y
        CONFIG_PACKAGE_hostapd-common=y

        # ============================================
        # 10G PHY (Aquantia - 301W 必需)
        # ============================================
        CONFIG_PACKAGE_kmod-aq_phy=y

        # ============================================
        # NSS Hardware Offload (IPQ807x 硬件加速)
        # ============================================
        CONFIG_PACKAGE_kmod-qca-nss-ecm=y
        CONFIG_PACKAGE_kmod-qca-nss-drv=y
        CONFIG_PACKAGE_kmod-qca-nss-dp=y

        # ============================================
        # USB Support
        # ============================================
        CONFIG_PACKAGE_kmod-usb3=y
        CONFIG_PACKAGE_kmod-usb-storage=y
        CONFIG_PACKAGE_kmod-usb-storage-extras=y
        CONFIG_PACKAGE_kmod-usb-storage-uas=y

        # ============================================
        # Filesystem
        # ============================================
        CONFIG_PACKAGE_kmod-fs-ext4=y
        CONFIG_PACKAGE_kmod-fs-ntfs=y
        CONFIG_PACKAGE_kmod-fs-vfat=y
        CONFIG_PACKAGE_e2fsprogs=y
        CONFIG_PACKAGE_losetup=y
        CONFIG_PACKAGE_resize2fs=y

        # ============================================
        # IPv6 Support
        # ============================================
        CONFIG_PACKAGE_ipv6helper=y
        CONFIG_PACKAGE_kmod-ipt-nat6=y

        # ============================================
        # Network Utilities
        # ============================================
        CONFIG_PACKAGE_kmod-nft-offload=y
        CONFIG_PACKAGE_firewall4=y
        CONFIG_PACKAGE_kmod-tun=y

        # ============================================
        # Optional: Common LuCI Apps (按需取消注释)
        # ============================================
        # CONFIG_PACKAGE_luci-app-upnp=y
        # CONFIG_PACKAGE_luci-app-ddns=y
        # CONFIG_PACKAGE_luci-app-wol=y
        # CONFIG_PACKAGE_luci-app-nlbwmon=y
        # CONFIG_PACKAGE_luci-app-ttyd=y
        # CONFIG_PACKAGE_luci-app-vlmcsd=y
        # CONFIG_PACKAGE_luci-app-openclash=y
        # CONFIG_PACKAGE_luci-app-passwall=y
        # CONFIG_PACKAGE_luci-app-homeproxy=y

        # ============================================
        # Optional: Docker Support (301W 1GB/2GB 内存可开启)
        # ============================================
        # CONFIG_PACKAGE_luci-app-dockerman=y
        # CONFIG_PACKAGE_docker=y
        # CONFIG_PACKAGE_dockerd=y
        EOF
        make defconfig
        echo "=== Target device verification ==="
        grep "CONFIG_TARGET_DEVICE" .config | head -5
        echo "=== 301W specific packages ==="
        grep -E "qnap_301w|aq_phy|nss" .config | head -10

    - name: Copy custom files
      run: |
        cd openwrt
        if [ -d "$GITHUB_WORKSPACE/files" ]; then
          cp -rf $GITHUB_WORKSPACE/files/* files/
          echo "Custom files copied"
        fi

    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')

    - name: Download package sources
      run: |
        cd openwrt
        make download -j8 || make download -j1 V=s
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile ImmortalWrt
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "=== Output files ==="
        ls -la bin/targets/qualcommax/ipq807x/

    - name: Organize firmware
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd openwrt/bin/targets/qualcommax/ipq807x/
        rm -rf packages
        echo "FIRMWARE_PATH=$(pwd)" >> $GITHUB_ENV
        echo "=== Firmware files ==="
        ls -la

    - name: Upload firmware to artifact
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt-301W-${{ env.RELEASE_TAG }}
        path: ${{ env.FIRMWARE_PATH }}/*

    - name: Generate release tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
      id: tag
      run: |
        echo "release_tag=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
        echo "release_date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: ImmortalWrt 301W ${{ steps.tag.outputs.release_date }}
        body: |
          ## ImmortalWrt for QNAP QHora-301W
          - 编译时间: ${{ steps.tag.outputs.release_date }}
          - 源码分支: ${{ env.REPO_BRANCH }}
          - 设备: QNAP QHora-301W (IPQ8072A)
          - 平台: qualcommax/ipq807x
          - 默认IP: 192.168.1.1
          - 默认密码: 无
          - 10G PHY: 已包含 Aquantia 驱动
          - NSS 加速: 已启用
        files: ${{ env.FIRMWARE_PATH }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
