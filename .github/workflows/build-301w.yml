name: Build ImmortalWrt for QNAP 301W

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      release:
        description: 'Upload to release'
        required: false
        default: 'true'
  schedule:
    - cron: 0 20 * * *

env:
  REPO_URL: https://github.com/kunude/immortalwrt-301w
  REPO_BRANCH: master
  CONFIG_FILE: config/301w.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: ${{ github.event.inputs.release }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id || !github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 \
          libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lld llvm lrzsz mkisofs msmtp \
          nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
          texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone ImmortalWrt source
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Verify QNAP 301W support
      run: |
        cd openwrt
        echo "=== Device definitions ==="
        grep -r "qnap_301w" target/linux/qualcommax/ | head -5 || true
        echo "=== DTS files ==="
        find . -name "*301w*" -type f | grep -E "\.(dts|dtsi)$" | head -5 || true
        echo "=== Kernel config for IPQ8074 ==="
        grep "IPQ8074" target/linux/qualcommax/ipq807x/config-* 2>/dev/null | head -5 || true
        echo "=== Default device packages ==="
        grep -A2 "define Device/qnap_301w" target/linux/qualcommax/image/ipq807x.mk || true

    - name: Run DIY script (before feeds)
      run: |
        cd openwrt
        if [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ]; then
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"
        fi

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Install third-party packages (homeproxy, passwall)
      working-directory: ./openwrt/package
      run: |
          chmod +x $GITHUB_WORKSPACE/scripts/update-packages.sh
          bash $GITHUB_WORKSPACE/scripts/update-packages.sh 
          
    - name: Run DIY script (after feeds)
      run: |
        cd openwrt
        if [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ]; then
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
        fi

    - name: Load custom config
      run: |
        cd openwrt
        cp -f "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
        make defconfig
        echo "=== Target device ==="
        grep "CONFIG_TARGET_DEVICE" .config | head -5
        echo "=== 301W packages ==="
        grep -E "qnap_301w|aq_phy|nss|ipq-wifi" .config | head -10

    - name: Copy custom files
      run: |
        cd openwrt
        if [ -d "$GITHUB_WORKSPACE/files" ]; then
          cp -rf $GITHUB_WORKSPACE/files/* files/
          echo "Custom files copied"
        fi

    - name: SSH connection to Actions
      uses: mxschmitt/action-tmate@v3
      if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')

    - name: Download package sources
      run: |
        cd openwrt
        make download -j8 || make download -j1 V=s
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile ImmortalWrt
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "=== Output files ==="
        ls -la bin/targets/qualcommax/ipq807x/

    - name: Organize firmware
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd openwrt/bin/targets/qualcommax/ipq807x/
        rm -rf packages
        echo "FIRMWARE_PATH=$(pwd)" >> $GITHUB_ENV
        echo "=== Firmware files ==="
        ls -la

    - name: Upload firmware to artifact
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt-301W-${{ env.RELEASE_TAG }}
        path: ${{ env.FIRMWARE_PATH }}/*

    - name: Generate release tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
      id: tag
      run: |
        echo "release_tag=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
        echo "release_date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: ImmortalWrt 301W ${{ steps.tag.outputs.release_date }}
        body: |
          ## ImmortalWrt for QNAP QHora-301W
          - 编译时间: ${{ steps.tag.outputs.release_date }}
          - 源码分支: ${{ env.REPO_BRANCH }}
          - 设备: QNAP QHora-301W (IPQ8072A)
          - 平台: qualcommax/ipq807x
          - 默认IP: 192.168.1.1
          - 默认密码: 无
        files: ${{ env.FIRMWARE_PATH }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
