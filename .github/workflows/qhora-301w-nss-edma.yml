#
# 文件结构说明：
# - 本文件应放在 .github/workflows/ 目录下
# - 需要将 passwall.txt 重命名为 IPQ807X-WIFI-YES.txt，放到 Config/ 目录
# - 需要 Config/GENERAL.txt 通用配置文件
# - Scripts/ 目录下需要 Packages.sh、Handles.sh、Settings.sh
#   （分别对应 Packages.txt、Handles.txt、Settings.txt）
#
# qhora-301w OpenWrt 云编译工作流
# 源码: JuliusBairaktaris/openwrt-nss-edma
# 分支: nss-edma-rework

name: qhora-301w-nss-edma

on:
  workflow_dispatch:
    inputs:
      CONFIG:
        description: '编译配置模板（对应 Config/*.txt）'
        default: 'IPQ807X-WIFI-YES'
        required: true
        type: choice
        options:
          - IPQ807X-WIFI-YES
          - IPQ807X-WIFI-NO
      PACKAGE:
        description: '手动调整插件包，多个请用换行符隔开'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件'
        default: false
        required: true
        type: boolean

permissions: write-all

jobs:
  config:
    name: qhora-301w-${{ inputs.CONFIG }}
    # 调用 VIKINGYFY/OpenWRT-CI 框架的公共编译核心
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      # 编译配置
      WRT_CONFIG: ${{ inputs.CONFIG }}
      # 默认主题
      WRT_THEME: bootstrap
      # 默认主机名
      WRT_NAME: qhora-301w
      # 默认 WIFI 名称
      WRT_SSID: qhora-301w
      # 默认 WIFI 密码
      WRT_WORD: 12345678
      # 默认地址
      WRT_IP: 192.168.35.1
      # 默认密码提示
      WRT_PW: 无
      # 源码链接
      WRT_REPO: https://github.com/JuliusBairaktaris/openwrt-nss-edma.git
      # 源码分支
      WRT_BRANCH: nss-edma-rework
      # 源码名称
      WRT_SOURCE: JuliusBairaktaris/openwrt-nss-edma
      # 插件调整
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      # 仅输出配置文件
      WRT_TEST: ${{ inputs.TEST }}
