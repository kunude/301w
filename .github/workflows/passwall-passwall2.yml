name: immortalwrt-passwall Builder

on:
  repository_dispatch:
  workflow_dispatch:
  # 每周六北京时间 02:38 自动检测上游更新
  schedule:
    - cron: '38 18 * * 5'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  # 更新检测 - 仅监控必要源
  check:
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.fp.outputs.build }}
      fp: ${{ steps.fp.outputs.fp }}
    steps:
      - name: 检测上游更新 (Check Upstream)
        id: fp
        run: |
          NEW_FP=""
          # ① 官方源码分支
          NEW_FP+=$(git ls-remote $REPO_URL refs/heads/$REPO_BRANCH | awk '{print $1}')
          # ② 官方 feeds
          NEW_FP+=$(git ls-remote https://github.com/immortalwrt/luci refs/heads/master | awk '{print $1}')
          NEW_FP+=$(git ls-remote https://github.com/immortalwrt/packages refs/heads/master | awk '{print $1}')
          # ③ Passwall 核心仓库
          NEW_FP+=$(git ls-remote https://github.com/Openwrt-Passwall/openwrt-passwall HEAD | awk '{print $1}')
          NEW_FP+=$(git ls-remote https://github.com/Openwrt-Passwall/openwrt-passwall2 HEAD | awk '{print $1}')
          # 如果您的 diy-part1.sh 还克隆其他插件，可在此添加对应的 git ls-remote 行

          NEW_FP=$(echo "$NEW_FP" | md5sum | awk '{print $1}')
          echo "新指纹: $NEW_FP"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "fp=$NEW_FP" >> $GITHUB_OUTPUT
            exit 0
          fi
          OLD_FP=$(curl -s "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
            | grep -o 'FP: [a-f0-9]\+' | head -1 | awk '{print $2}')
          echo "旧指纹: $OLD_FP"
          if [ "$NEW_FP" != "$OLD_FP" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi
          echo "fp=$NEW_FP" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-22.04
    needs: check
    if: needs.check.outputs.build == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [passwall, passwall2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          CONFIG_FILE="config/${{ matrix.variant }}.config"
          if [ -e "$CONFIG_FILE" ]; then
            mv "$CONFIG_FILE" openwrt/.config
          else
            echo "❌ 配置文件 $CONFIG_FILE 不存在，请创建！"
            exit 1
          fi
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          DEVICE_NAME="$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' | sort -u | tr '\n' '_' | sed 's/_$//')"
          [ -n "$DEVICE_NAME" ] && echo "DEVICE_NAME=_${DEVICE_NAME}" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          echo "VARIANT=${{ matrix.variant }}" >> $GITHUB_ENV

      - name: Generate release notes
        id: notes
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt
          FP="${{ needs.check.outputs.fp }}"
          KERNEL_VER=$(grep -rh "^LINUX_VERSION" include/kernel-* 2>/dev/null | head -1 | awk -F'=' '{print $2}' | tr -d ' ')
          [ -z "$KERNEL_VER" ] && KERNEL_VER="6.x"
          RAW_VER=$(cat version.date 2>/dev/null)
          if echo "$RAW_VER" | grep -qE '^[0-9]{9,}$'; then
            SYSTEM_VER=$(date -d "@$RAW_VER" +"%Y-%m-%d" 2>/dev/null || echo "master")
          else
            SYSTEM_VER="${RAW_VER:-master}"
          fi
          PLUGINS=$(grep "CONFIG_PACKAGE_luci-app-" .config | grep "=y" | grep -v "rclone" | sed 's/CONFIG_PACKAGE_//g;s/=y//g' | sort | sed 's/^/- /')
          THEMES=$(grep "CONFIG_PACKAGE_luci-theme-" .config | grep "=y" | sed 's/CONFIG_PACKAGE_//;s/=y//g' | sort | sed 's/^/- /')

          get_pkg_ver() {
            local pkg=$1 ver=""
            ver=$(grep -A 2 "Package: $pkg$" tmp/info/.files-packageinfo 2>/dev/null \
              | grep "Version:" | awk '{print $2}' | head -1)
            if [ -z "$ver" ]; then
              local f=$(find bin -type f \( -name "${pkg}-*.apk" -o -name "${pkg}_*.ipk" \) 2>/dev/null | head -1)
              if [ -n "$f" ]; then
                ver=$(basename "$f" | sed -E "s/^${pkg}[-_]?//; s/\.(apk|ipk)$//; s/_(aarch64|arm|x86|mips|riscv|loongarch)[a-z0-9_.-]*$//")
              fi
            fi
            if [ -z "$ver" ]; then
              local mk=$(find package/ feeds/ -name "Makefile" -path "*/$pkg/*" 2>/dev/null | head -1)
              if [ -n "$mk" ]; then
                ver=$(grep "^PKG_VERSION" "$mk" | head -1 | awk -F':=' '{print $2}' | tr -d ' ')
                local rel=$(grep "^PKG_RELEASE" "$mk" | head -1 | awk -F':=' '{print $2}' | tr -d ' ')
                [ -n "$ver" ] && [ -n "$rel" ] && ver="$ver-$rel"
              fi
            fi
            echo "${ver:-Unknown}"
          }

          VER_PASSWALL=$(get_pkg_ver "luci-app-passwall")
          VER_PASSWALL2=$(get_pkg_ver "luci-app-passwall2")
          VER_XRAY=$(get_pkg_ver "xray-core")
          VER_V2RAY=$(get_pkg_ver "v2ray-core")
          VER_TROJAN=$(get_pkg_ver "trojan-go")
          VER_SSRUST=$(get_pkg_ver "shadowsocks-libev-ssrust")
          VER_KUCAT=$(get_pkg_ver "luci-theme-kucat")
          VER_ARGON=$(get_pkg_ver "luci-theme-argon")

          cat > release_notes.txt <<EOF
          ### ImmortalWrt 固件 (Passwall 定制版 - ${{ env.VARIANT }})
          **编译时间**: $(date +"%Y-%m-%d %H:%M:%S")
          **系统版本**: ImmortalWrt $SYSTEM_VER (分支 $REPO_BRANCH)
          **Linux 内核**: $KERNEL_VER
          **目标设备**: ${{ env.DEVICE_NAME }}
          **固件变体**: ${{ env.VARIANT }}
          **固件格式**: 由设备配置决定 (bin, img, itb 等)
          **包管理器**: apk (Alpine Package Keeper)
          ---
          ### 🔰 Passwall 核心组件版本
          - **luci-app-passwall**: $VER_PASSWALL
          - **luci-app-passwall2**: $VER_PASSWALL2
          - **xray-core**: $VER_XRAY
          - **v2ray-core**: $VER_V2RAY
          - **trojan-go**: $VER_TROJAN
          - **shadowsocks-libev-ssrust**: $VER_SSRUST
          ---
          ### 🎨 主题版本
          - **Kucat Theme**: $VER_KUCAT
          - **Argon Theme**: $VER_ARGON
          ---
          ### ⚠️ 刷机须知
          1. **默认 IP**: 请查看您设备的默认配置（通常为 192.168.1.1）
          2. **默认密码**: 无 (留空)
          3. **Wi-Fi**: 刷机后请在后台设置
          4. **包管理器**: 此版本使用 apk，不再支持 opkg
          ---
          ### 内置主题
          $THEMES
          ---
          ### 内置插件清单
          $PLUGINS
          ---
          ### 特性说明
          - ✅ 基于 ImmortalWrt master 分支，持续更新
          - ✅ 集成 ${{ env.VARIANT }} 及相关依赖
          - ✅ 支持 IPv6
          - ✅ 使用 apk 包管理器
          <!-- FP: $FP -->
          EOF
          echo "notes_file=$PWD/release_notes.txt" >> $GITHUB_OUTPUT

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin_${{ env.VARIANT }}${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          mkdir -p firmware
          cp * firmware/ 2>/dev/null || true
          cp sha256sums firmware/ 2>/dev/null || true
          echo "FIRMWARE=$PWD/firmware" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware_${{ env.VARIANT }}${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=${{ env.VARIANT }}-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: openwrt/release_notes.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TRIGGER_PAT }}
        with:
          token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
          retain_days: 0
          keep_minimum_runs: 2

      - name: Remove old Releases (per variant)
        uses: actions/github-script@v9
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANT: ${{ env.VARIANT }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const variant = process.env.VARIANT;
            const keepLatest = 3;
            const deleteTags = true;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            // 过滤出当前变体的 Releases（以 variant- 开头）
            const variantReleases = releases.filter(r => r.tag_name.startsWith(variant + '-'));
            variantReleases.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            core.info(`Total releases for ${variant}: ${variantReleases.length}`);

            const toDelete = variantReleases.slice(keepLatest);
            for (const rel of toDelete) {
              core.info(`Deleting release '${rel.tag_name}' (created ${rel.created_at})`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.id
              });
              if (deleteTags && rel.tag_name) {
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${rel.tag_name}`
                  });
                  core.info(`  -> deleted tag ${rel.tag_name}`);
                } catch (err) {
                  core.info(`  -> tag ${rel.tag_name} not deleted: ${err.message}`);
                }
              }
            }
            core.info(`Kept ${Math.min(keepLatest, variantReleases.length)} release(s) for ${variant}.`);
